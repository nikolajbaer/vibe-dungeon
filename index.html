<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vibe-dungeon</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
        position: relative;
        touch-action: none;
      }
      #controls-hint {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        max-width: calc(100vw - 32px);
        width: max-content;
        text-align: center;
        color: #eee;
        font: 14px/1.4 system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.45);
        padding: 6px 14px;
        border-radius: 6px;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      #controls-hint.hidden {
        opacity: 0;
      }
      .touch-joystick {
        position: fixed;
        bottom: 20px;
        touch-action: none;
      }
      .touch-joystick-left {
        left: 20px;
      }
      .touch-joystick-right {
        right: 20px;
      }
      .touch-joystick canvas {
        touch-action: none;
        display: block;
      }
      .touch-attack-btn {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.35);
        color: rgba(255, 255, 255, 0.75);
        font: 700 13px/1 system-ui, sans-serif;
        letter-spacing: 0.05em;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .touch-attack-btn:active {
        background: rgba(217, 67, 63, 0.5);
        border-color: rgba(255, 255, 255, 0.6);
      }
      #hud-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #menu-overlay {
        position: fixed;
        inset: 0;
      }
      .menu-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b12;
        color: #eee;
        font: 16px/1.4 system-ui, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .menu-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        width: 100%;
        max-width: 360px;
      }
      .menu-title {
        margin: 0;
        font-size: clamp(28px, 8vw, 40px);
        letter-spacing: 0.04em;
        text-align: center;
        color: #fff;
      }
      .menu-options {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
      }
      .menu-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        padding: 12px 20px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 8px;
        cursor: pointer;
      }
      .menu-btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.16);
      }
      .menu-btn-disabled {
        color: rgba(255, 255, 255, 0.4);
        border-color: rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.03);
        cursor: not-allowed;
      }
      .menu-btn-note {
        font-size: 11px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.35);
      }
      .hud-health-bar {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: clamp(90px, 28vw, 200px);
        height: 16px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.35);
        overflow: hidden;
      }
      .hud-health-bar-fill {
        height: 100%;
        background: #d9433f;
        transition: width 0.15s ease;
      }
      .hud-health-bar-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font: 10px/1 system-ui, sans-serif;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      /* Inventory UI (issue #39): paper doll + inventory list, right side of
         screen. A separate fixed overlay from #hud-overlay (own container,
         see src/inventory/mount.tsx) since — unlike the HUD, which is purely
         read-only display — its buttons need pointer events; the panel root
         stays pointer-events:none like the HUD overlay and opts individual
         buttons back in, so the rest of the screen still passes touches
         through to the look-drag/move-stick controls underneath. */
      #inventory-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #inventory-root {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        /* Clears the "click to look around"/touch-controls hint banner
           (#controls-hint), which is centered near the top of the screen
           and can be wide enough to reach the right edge on narrow phones. */
        top: calc(52px + env(safe-area-inset-top));
        width: clamp(150px, 34vw, 220px);
        display: flex;
        flex-direction: column;
        gap: 8px;
        font: 12px/1.3 system-ui, sans-serif;
        color: #eee;
      }
      .inv-paperdoll,
      .inv-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 8px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        pointer-events: auto;
      }
      .inv-slot,
      .inv-list-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        aspect-ratio: 1;
        padding: 4px 2px;
        font: inherit;
        color: inherit;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        cursor: pointer;
      }
      .inv-slot:disabled,
      .inv-list-item:disabled {
        cursor: default;
      }
      .inv-slot:not(:disabled):active,
      .inv-list-item:not(:disabled):active {
        background: rgba(255, 255, 255, 0.22);
      }
      .inv-slot-icon,
      .inv-list-item-icon {
        font-size: 20px;
        line-height: 1;
      }
      .inv-slot-label {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.6);
        text-align: center;
      }
      .inv-list-empty {
        grid-column: 1 / -1;
        text-align: center;
        color: rgba(255, 255, 255, 0.45);
        padding: 6px 0;
      }
      /* Dialogue panel: its own fixed overlay (#dialogue-overlay, see
         src/dialogue/mount.tsx), same "own container, own pointer-events"
         split as #inventory-overlay above. */
      #dialogue-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .dialogue-root {
        position: fixed;
        left: 50%;
        bottom: calc(56px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: min(calc(100vw - 32px), 420px);
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 16px;
        background: rgba(10, 10, 16, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        color: #eee;
        font: 14px/1.4 system-ui, sans-serif;
        pointer-events: auto;
      }
      .dialogue-speaker {
        font-weight: 700;
        color: #ffcc44;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .dialogue-choices {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .dialogue-choice {
        font: inherit;
        color: inherit;
        text-align: left;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        cursor: pointer;
      }
      .dialogue-choice:active {
        background: rgba(255, 255, 255, 0.2);
      }
      .death-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: rgba(20, 0, 0, 0.75);
        pointer-events: auto;
      }
      .death-title {
        font: 700 clamp(28px, 8vw, 40px)/1 system-ui, sans-serif;
        letter-spacing: 0.06em;
        color: #d9433f;
        text-transform: uppercase;
      }
      .death-respawn-btn {
        font: 600 15px/1 system-ui, sans-serif;
        color: #fff;
        padding: 12px 28px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 8px;
        cursor: pointer;
      }
      .death-respawn-btn:active {
        background: rgba(255, 255, 255, 0.22);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
