<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vibe-dungeon</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
        position: relative;
        touch-action: none;
      }
      .touch-joystick {
        position: fixed;
        bottom: 20px;
        touch-action: none;
      }
      .touch-joystick-left {
        left: 20px;
      }
      .touch-joystick-right {
        right: 20px;
      }
      .touch-joystick canvas {
        touch-action: none;
        display: block;
      }
      .touch-attack-btn {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.35);
        color: rgba(255, 255, 255, 0.75);
        font: 700 13px/1 system-ui, sans-serif;
        letter-spacing: 0.05em;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        z-index: 30;
      }
      .touch-attack-btn:active {
        background: rgba(217, 67, 63, 0.5);
        border-color: rgba(255, 255, 255, 0.6);
      }
      #hud-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #menu-overlay {
        position: fixed;
        inset: 0;
      }
      .menu-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b12;
        color: #eee;
        font: 16px/1.4 system-ui, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .menu-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        width: 100%;
        max-width: 360px;
      }
      .menu-title {
        margin: 0;
        font-size: clamp(28px, 8vw, 40px);
        letter-spacing: 0.04em;
        text-align: center;
        color: #fff;
      }
      .menu-options {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
      }
      .menu-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        padding: 12px 20px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 8px;
        cursor: pointer;
      }
      .menu-btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.16);
      }
      .menu-btn-disabled {
        color: rgba(255, 255, 255, 0.4);
        border-color: rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.03);
        cursor: not-allowed;
      }
      .menu-btn-note {
        font-size: 11px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.35);
      }
      .hud-health-bar {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: clamp(90px, 28vw, 200px);
        height: 16px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.35);
        overflow: hidden;
      }
      .hud-health-bar-fill {
        height: 100%;
        background: #d9433f;
        transition: width 0.15s ease;
      }
      .hud-health-bar-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font: 10px/1 system-ui, sans-serif;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      .practice-score {
        position: fixed;
        left: 50%;
        bottom: 82px;
        transform: translateX(-50%);
        min-width: 360px;
        display: flex;
        justify-content: space-between;
        gap: 22px;
        padding: 9px 14px;
        border: 1px solid rgba(220, 190, 120, .65);
        background: rgba(24, 18, 12, .82);
        color: #ead9b0;
        font: 600 13px/1.2 system-ui, sans-serif;
        pointer-events: none;
      }
      /* Short-lived on-screen message (hudStore.showMessage, e.g. "Door is
         locked."), top-center so it doesn't collide with the health bar or
         either touch control at the bottom. */
      .hud-message {
        position: fixed;
        left: 50%;
        top: calc(20px + env(safe-area-inset-top));
        transform: translateX(-50%);
        max-width: min(calc(100vw - 32px), 360px);
        padding: 10px 18px;
        background: rgba(0, 0, 0, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        color: #fff;
        font: 600 14px/1.3 system-ui, sans-serif;
        text-align: center;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      /* Inventory UI (issue #39): paper doll + inventory list, right side of
         screen. A separate fixed overlay from #hud-overlay (own container,
         see src/inventory/mount.tsx) since — unlike the HUD, which is purely
         read-only display — its buttons need pointer events; the panel root
         stays pointer-events:none like the HUD overlay and opts individual
         buttons back in, so the rest of the screen still passes touches
         through to the look-drag/move-stick controls underneath. */
      #inventory-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        /* Reserve the attack control's full 90px diameter, its 20px bottom
           offset, and a 16px breathing gap. The inventory can scroll within
           the remaining height but can never cover the attack hit target. */
        padding-bottom: calc(126px + env(safe-area-inset-bottom));
        box-sizing: border-box;
        z-index: 20;
      }
      #inventory-root {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        top: max(12px, env(safe-area-inset-top));
        bottom: calc(126px + env(safe-area-inset-bottom));
        width: clamp(150px, 34vw, 220px);
        display: flex;
        flex-direction: column;
        gap: 8px;
        font: 12px/1.3 system-ui, sans-serif;
        color: #eee;
        max-height: calc(100dvh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
      }
      #game-menu-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 40;
      }
      .game-menu-root {
        position: fixed;
        left: 50%;
        top: calc(10px + env(safe-area-inset-top));
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        pointer-events: none;
        font: 600 13px/1.2 system-ui, sans-serif;
      }
      .game-menu-toggle,
      .game-menu-action {
        min-height: 38px;
        padding: 9px 15px;
        color: #fff;
        background: rgba(8, 8, 12, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 8px;
        font: inherit;
        white-space: nowrap;
        cursor: pointer;
        pointer-events: auto;
        touch-action: manipulation;
      }
      .game-menu-toggle:active,
      .game-menu-action:not(:disabled):active {
        background: rgba(255, 255, 255, 0.22);
      }
      .game-menu-panel {
        width: 170px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 9px;
        background: rgba(8, 8, 12, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        pointer-events: auto;
      }
      .game-menu-action {
        width: 100%;
      }
      .game-menu-action:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .game-menu-restart {
        border-color: rgba(255, 170, 120, 0.55);
      }
      .inv-paperdoll,
      .inv-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 8px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        pointer-events: auto;
      }
      .inv-slot,
      .inv-list-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        aspect-ratio: 1;
        padding: 4px 2px;
        font: inherit;
        color: inherit;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        cursor: pointer;
      }
      .inv-slot:disabled,
      .inv-list-item:disabled {
        cursor: default;
      }
      .inv-slot:not(:disabled):active,
      .inv-list-item:not(:disabled):active {
        background: rgba(255, 255, 255, 0.22);
      }
      .inv-slot-icon,
      .inv-list-item-icon {
        font-size: 20px;
        line-height: 1;
      }
      .inv-item-icon-image {
        display: block;
        width: 34px;
        height: 34px;
        object-fit: contain;
        pointer-events: none;
      }
      /* Stack count badge (a coin pile, etc. -- CarriedItemView.count /
         ContainerItemView.count), bottom-right corner of the item button.
         Only ever rendered on a `Stackable` item, so its mere presence
         already implies "more than one" is possible even at count 1. */
      .inv-list-item {
        position: relative;
      }
      .inv-list-item-count {
        position: absolute;
        right: 3px;
        bottom: 2px;
        font-size: 10px;
        font-weight: 700;
        color: #fff;
        background: rgba(0, 0, 0, 0.65);
        border-radius: 4px;
        padding: 0 3px;
        line-height: 1.3;
        pointer-events: none;
      }
      .inv-slot-label {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.6);
        text-align: center;
      }
      .inv-list-empty {
        grid-column: 1 / -1;
        text-align: center;
        color: rgba(255, 255, 255, 0.45);
        padding: 6px 0;
      }
      /* Carry-weight readout (WeightReadout.tsx), between the paper doll and
         the inventory list -- same panel background as both so it reads as
         part of the one inventory column rather than a floating label. */
      .inv-weight {
        text-align: center;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
      }
      /* Drop zone (DropZone.tsx) -- an ordinary button until armed, then
         switches to a warning red/dashed look so it reads as "live" the same
         way TARGETABLE_STYLE's dashed border does in PaperDoll.tsx, just a
         distinct color so the two "waiting for a tap" modes don't look
         identical. */
      .inv-drop-zone {
        font: inherit;
        font-weight: 600;
        color: inherit;
        padding: 8px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        cursor: pointer;
        pointer-events: auto;
      }
      .inv-drop-zone:active {
        background: rgba(255, 255, 255, 0.2);
      }
      .inv-drop-zone[data-armed="true"] {
        background: rgba(217, 67, 63, 0.35);
        border-style: dashed;
        border-color: #ff6b6b;
      }
      /* Dialogue panel: its own fixed overlay (#dialogue-overlay, see
         src/dialogue/mount.tsx), same "own container, own pointer-events"
         split as #inventory-overlay above. */
      #dialogue-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .dialogue-root {
        position: fixed;
        left: 50%;
        bottom: calc(56px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: min(calc(100vw - 32px), 420px);
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px 16px;
        background: rgba(10, 10, 16, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        color: #eee;
        font: 14px/1.4 system-ui, sans-serif;
        pointer-events: auto;
      }
      .dialogue-speaker {
        font-weight: 700;
        color: #ffcc44;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .dialogue-choices {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .dialogue-choice {
        font: inherit;
        color: inherit;
        text-align: left;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        cursor: pointer;
      }
      .dialogue-choice:active {
        background: rgba(255, 255, 255, 0.2);
      }
      /* Notice reader (posters/scrolls): its own fixed overlay
         (#notice-overlay, see src/notice/mount.tsx), same "own container,
         own pointer-events" split as the dialogue panel above -- deliberately
         a taller, wider panel than the dialogue one, since a notice's body
         text runs longer than a line of spoken dialogue. */
      #notice-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .notice-root {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(calc(100vw - 32px), 480px);
        max-height: min(calc(100vh - 64px), 520px);
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 20px 22px;
        background: rgba(18, 14, 8, 0.92);
        border: 1px solid rgba(255, 220, 160, 0.35);
        border-radius: 10px;
        color: #f0e6d2;
        font: 14px/1.5 system-ui, sans-serif;
        pointer-events: auto;
      }
      .notice-title {
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.02em;
        color: #ffcc44;
        border-bottom: 1px solid rgba(255, 220, 160, 0.25);
        padding-bottom: 8px;
      }
      .notice-page {
        overflow-y: auto;
        white-space: pre-wrap;
      }
      .notice-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .notice-nav-btn,
      .notice-close-btn {
        font: inherit;
        font-weight: 600;
        color: inherit;
        padding: 8px 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 220, 160, 0.3);
        border-radius: 6px;
        cursor: pointer;
      }
      .notice-nav-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .notice-nav-btn:not(:disabled):active,
      .notice-close-btn:active {
        background: rgba(255, 255, 255, 0.2);
      }
      .notice-page-label {
        font-size: 12px;
        color: rgba(240, 230, 210, 0.6);
      }
      .notice-close-btn {
        margin-left: auto;
      }
      /* Container panel (barrels): its own fixed overlay (#container-overlay,
         see src/container/mount.tsx), same "own container, own
         pointer-events" split as the notice panel above -- two columns
         (container contents / player inventory) reusing `.inv-list`'s grid
         styling from the paper-doll inventory, since both are "a grid of
         tappable item icons" the same way. */
      #container-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .container-root {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(calc(100vw - 32px), 520px);
        max-height: min(calc(100vh - 64px), 560px);
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 20px 22px;
        background: rgba(14, 14, 18, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        color: #eee;
        font: 14px/1.5 system-ui, sans-serif;
        pointer-events: auto;
      }
      .container-title {
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.02em;
        color: #ffcc44;
        border-bottom: 1px solid rgba(255, 255, 255, 0.25);
        padding-bottom: 8px;
      }
      .container-columns {
        display: flex;
        gap: 14px;
      }
      .container-column {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .container-column-label {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
      }
      .container-close-btn {
        align-self: flex-end;
        font: inherit;
        font-weight: 600;
        color: inherit;
        padding: 8px 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        cursor: pointer;
      }
      .container-close-btn:active {
        background: rgba(255, 255, 255, 0.2);
      }
      /* Quantity picker (ContainerPanel.tsx's `pendingTransfer`) -- a small
         overlay on top of the two-column view, same "own fixed layer"
         instinct as the panel itself, just centered within it rather than
         the whole viewport since it's a modal-within-a-modal. */
      .container-transfer-overlay {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 18px 20px;
        background: rgba(10, 10, 14, 0.96);
        border: 1px solid rgba(255, 204, 68, 0.5);
        border-radius: 10px;
        min-width: 200px;
      }
      .container-transfer-header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .container-transfer-stepper {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .container-transfer-stepper button {
        font: inherit;
        font-weight: 700;
        color: inherit;
        min-width: 32px;
        padding: 6px 10px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        cursor: pointer;
      }
      .container-transfer-stepper button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .container-transfer-qty {
        min-width: 28px;
        text-align: center;
        font-weight: 700;
      }
      .container-transfer-actions {
        display: flex;
        gap: 8px;
      }
      .container-transfer-actions button {
        font: inherit;
        font-weight: 600;
        color: inherit;
        padding: 8px 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        cursor: pointer;
      }
      .container-transfer-actions button:active,
      .container-transfer-stepper button:not(:disabled):active {
        background: rgba(255, 255, 255, 0.2);
      }
      .death-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: rgba(20, 0, 0, 0.75);
        pointer-events: auto;
      }
      .death-title {
        font: 700 clamp(28px, 8vw, 40px)/1 system-ui, sans-serif;
        letter-spacing: 0.06em;
        color: #d9433f;
        text-transform: uppercase;
      }
      .death-respawn-btn {
        font: 600 15px/1 system-ui, sans-serif;
        color: #fff;
        padding: 12px 28px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 8px;
        cursor: pointer;
      }
      .death-respawn-btn:active {
        background: rgba(255, 255, 255, 0.22);
      }
      /* Level viewer (menu's "View Tiles", src/viewer/levelViewer.ts): a
         plain DOM overlay (not Preact — no reactive state here, same
         reasoning as the click-to-look hint) for the back button and the
         sector-color legend, layered over its own orbit-camera canvas. */
      #viewer-hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .viewer-back-btn {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        top: calc(12px + env(safe-area-inset-top));
        font: 600 14px/1 system-ui, sans-serif;
        color: #fff;
        padding: 10px 16px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 8px;
        cursor: pointer;
        pointer-events: auto;
      }
      .viewer-back-btn:active {
        background: rgba(255, 255, 255, 0.18);
      }
      .viewer-legend {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        top: calc(12px + env(safe-area-inset-top));
        min-width: 120px;
        font: 12px/1.5 system-ui, sans-serif;
        color: #eee;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        padding: 8px 12px;
        pointer-events: auto;
      }
      .viewer-legend-row {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .viewer-legend-swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
