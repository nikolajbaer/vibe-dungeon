<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vibe-dungeon</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
        position: relative;
        touch-action: none;
      }
      #controls-hint {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        max-width: calc(100vw - 32px);
        width: max-content;
        text-align: center;
        color: #eee;
        font: 14px/1.4 system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.45);
        padding: 6px 14px;
        border-radius: 6px;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      #controls-hint.hidden {
        opacity: 0;
      }
      .touch-joystick {
        position: fixed;
        bottom: 20px;
        touch-action: none;
      }
      .touch-joystick-right {
        right: 20px;
      }
      .touch-joystick canvas {
        touch-action: none;
        display: block;
      }
      #hud-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .hud-health-bar {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: clamp(90px, 28vw, 200px);
        height: 16px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.35);
        overflow: hidden;
      }
      .hud-health-bar-fill {
        height: 100%;
        background: #d9433f;
        transition: width 0.15s ease;
      }
      .hud-health-bar-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font: 10px/1 system-ui, sans-serif;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
